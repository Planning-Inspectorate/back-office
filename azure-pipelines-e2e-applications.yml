parameters:
  - name: Environment
    type: string
    default: 'test'
    values:
      - 'dev'
      - 'test'

variables:
  - name: APP
    value: 'applications'
  - group: e2e-${{ parameters.Environment }}

pr: none

trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.29.0

jobs:
  - job: E2E_Tests_Group_1
    timeoutInMinutes: 60
    pool: pins-odt-agent-pool-tests
    steps:
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: npm ci
          workingDirectory: 'apps/e2e'
          environmentVariables:
            npm_config_cache: $(npm_config_cache)
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: |
            npx cypress run --spec "cypress/e2e/back-office-applications/addRepresentation.spec.js,cypress/e2e/back-office-applications/addTeam.spec.js,cypress/e2e/back-office-applications/createCase.spec.js,cypress/e2e/back-office-applications/documentProperties.spec.js,cypress/e2e/back-office-applications/documentPropertiesWelsh.spec.js,cypress/e2e/back-office-applications/documentUpload.spec.js"
          workingDirectory: 'apps/e2e'
          environmentVariables:
            BASE_URL: $(BASE_URL)
            CASE_TEAM_EMAIL: $(CASE_TEAM_EMAIL)
            CASE_ADMIN_EMAIL: $(CASE_ADMIN_EMAIL)
            INSPECTOR_EMAIL: $(INSPECTOR_EMAIL)
            USER_PASSWORD: $(USER_PASSWORD)
            FEATURE_FLAG_CONNECTION_STRING: $(FEATURE_FLAG_CONNECTION_STRING)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: 'apps/e2e/cypress/screenshots'
          artifactName: 'FailedTests'
        displayName: "Publish Failed Tests Artifacts"
        condition: failed()

  - job: E2E_Tests_Group_2
    timeoutInMinutes: 60
    pool: pins-odt-agent-pool-tests
    steps:
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: npm ci
          workingDirectory: 'apps/e2e'
          environmentVariables:
            npm_config_cache: $(npm_config_cache)
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: |
            npx cypress run --spec "cypress/e2e/back-office-applications/documentVersioning.spec.js,cypress/e2e/back-office-applications/editCase.spec.js,cypress/e2e/back-office-applications/examTimetable.spec.js"
          workingDirectory: 'apps/e2e'
          environmentVariables:
            BASE_URL: $(BASE_URL)
            CASE_TEAM_EMAIL: $(CASE_TEAM_EMAIL)
            CASE_ADMIN_EMAIL: $(CASE_ADMIN_EMAIL)
            INSPECTOR_EMAIL: $(INSPECTOR_EMAIL)
            USER_PASSWORD: $(USER_PASSWORD)
            FEATURE_FLAG_CONNECTION_STRING: $(FEATURE_FLAG_CONNECTION_STRING)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: 'apps/e2e/cypress/screenshots'
          artifactName: 'FailedTests'
        displayName: "Publish Failed Tests Artifacts"
        condition: failed()

  - job: E2E_Tests_Group_3
    timeoutInMinutes: 60
    pool: pins-odt-agent-pool-tests
    steps:
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: npm ci
          workingDirectory: 'apps/e2e'
          environmentVariables:
            npm_config_cache: $(npm_config_cache)
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: |
            npx cypress run --spec "cypress/e2e/back-office-applications/publishDocuments.spec.js,cypress/e2e/back-office-applications/s51Advice.spec.js,cypress/e2e/back-office-applications/search.spec.js,cypress/e2e/back-office-applications/searchDocuments.spec.js,cypress/e2e/back-office-applications/sectorAsTraing.spec.js,cypress/e2e/back-office-applications/smokeTests.spec.js"
          workingDirectory: 'apps/e2e'
          environmentVariables:
            BASE_URL: $(BASE_URL)
            CASE_TEAM_EMAIL: $(CASE_TEAM_EMAIL)
            CASE_ADMIN_EMAIL: $(CASE_ADMIN_EMAIL)
            INSPECTOR_EMAIL: $(INSPECTOR_EMAIL)
            USER_PASSWORD: $(USER_PASSWORD)
            FEATURE_FLAG_CONNECTION_STRING: $(FEATURE_FLAG_CONNECTION_STRING)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: 'apps/e2e/cypress/screenshots'
          artifactName: 'FailedTests'
        displayName: "Publish Failed Tests Artifacts"
        condition: failed()

  - job: E2E_Tests_Group_4
    timeoutInMinutes: 60
    pool: pins-odt-agent-pool-tests
    steps:
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: npm ci
          workingDirectory: 'apps/e2e'
          environmentVariables:
            npm_config_cache: $(npm_config_cache)
      - template: steps/node_script.yml@templates
        parameters:
          nodeVersion: 22
          script: |
            DEBUG=cypress:* npx cypress run --headed --browser chrome --spec "cypress/e2e/back-office-applications/publishDocuments.spec.js,cypress/e2e/back-office-applications/s51Advice.spec.js,cypress/e2e/back-office-applications/search.spec.js,cypress/e2e/back-office-applications/searchDocuments.spec.js,cypress/e2e/back-office-applications/sectorAsTraing.spec.js,cypress/e2e/back-office-applications/smokeTests.spec.js"
          workingDirectory: 'apps/e2e'
          environmentVariables:
            BASE_URL: $(BASE_URL)
            CASE_TEAM_EMAIL: $(CASE_TEAM_EMAIL)
            CASE_ADMIN_EMAIL: $(CASE_ADMIN_EMAIL)
            INSPECTOR_EMAIL: $(INSPECTOR_EMAIL)
            USER_PASSWORD: $(USER_PASSWORD)
            FEATURE_FLAG_CONNECTION_STRING: $(FEATURE_FLAG_CONNECTION_STRING)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: 'apps/e2e/cypress/screenshots'
          artifactName: 'FailedTests'
        displayName: "Publish Failed Tests Artifacts"
        condition: failed()
